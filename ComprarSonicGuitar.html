<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>
        <section class="PaginaComprar">
            <div class="ContenedorMitad">
                <h1>Solo a un paso de que comience el show</h1>
                <img src="images/SonicGuitar.png" alt="Comprar">
            </div>
            <div class="ContenedorMitad">
                <a href="Index.html">
                    <p>⬅️ Volver</p>
                </a>
                <h2>Ingrese sus datos</h2>
                <form>
                    <div class="ContenedorDobleForm">
                        <div class="Input">
                            <label>Nombre</label>
                            <input type="text">
                        </div>
                        <div class="Input">
                            <label>Apellido</label>
                            <input type="text">
                        </div>
                    </div>
                    <div class="Input">
                        <label>Ciudad</label>
                        <input type="text">
                    </div>
                    <div class="ContenedorDobleForm">
                        <div class="Input">
                            <label>Domicilio</label>
                            <input type="text">
                        </div>
                        <div class="Input">
                            <label>Código postal</label>
                            <input type="text">
                        </div>
                    </div>
                    <div class="Input">
                        <label>Tarjeta de credito</label>
                        <input type="text">
                    </div>    
                        <label>
                            <input type="checkbox">
                            He leído la política de privacidad y los términos y condiciones
                        </label>
                    <button>Comprar</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
